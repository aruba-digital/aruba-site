<!DOCTYPE html>

<title>Aruba Digital — Fofoti v7</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f0ede6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 60px 40px;
  }
  h1 { font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: #a09880; font-weight: 600; }
  .row { display: flex; align-items: flex-start; gap: 28px; justify-content: center; flex-wrap: wrap; }
  .card {
    background: white; border-radius: 24px; padding: 36px 40px;
    display: flex; flex-direction: column; align-items: center; gap: 24px;
    box-shadow: 0 1px 24px rgba(0,0,0,0.06); min-width: 260px;
  }
  .card-dark { background: #0f0f0f; }
  .card-sand { background: #ece7da; }
  .label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #bbb; font-weight: 600; }
  .card-dark .label { color: #444; }
  .card-sand .label { color: #b0a898; }
  .sizes { display: flex; align-items: flex-end; gap: 28px; }
  .lockup { display: flex; align-items: center; gap: 10px; padding-top: 14px; border-top: 1px solid #f0f0f0; width: 100%; }
  .card-dark .lockup { border-color: #1e1e1e; }
  .card-sand .lockup { border-color: #d4cdc2; }
  .brand { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; color: #1c1c1e; line-height: 1; }
  .sub { font-size: 8px; letter-spacing: 0.14em; text-transform: uppercase; color: #aaa; margin-top: 3px; font-weight: 600; }
  .card-dark .brand { color: white; }
</style>
</head>

  - Left arm sweeps far left and droops low (like the divi-divi blown by trade winds)
